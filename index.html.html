<style>
/* Layout: one phone-width column — a voyage log. Home = map + 10 ports; each port = a log page. */
:root{
  --bg:#EEF2F4; --paper:#FFFFFF; --ink:#13223A; --muted:#5A6779; --line:#D5DDE3;
  --sea:#1F6F8B; --sea-soft:#DCEBF0; --today:#C8452F; --done:#2F7D57;
  --display:"Young Serif", Georgia, "Noto Serif KR", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --paper:#162232; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3A4E;
  --sea:#5BB3CF; --sea-soft:#17384A; --today:#F07A62; --done:#5CC08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --paper:#162232; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3A4E;
  --sea:#5BB3CF; --sea-soft:#17384A; --today:#F07A62; --done:#5CC08C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.hero h1{font-size:clamp(34px,9vw,48px);line-height:1.05}
.hero p{color:var(--muted);max-width:52ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:700}
input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.map-img{width:100%;height:auto;display:block;border-radius:8px}
.maps{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:center}
.maps img{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
@media (max-width:560px){.maps{grid-template-columns:1fr}}
.namebar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--sea-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.namebar b{font-weight:700}
.namebar a{color:var(--sea);font-weight:700;margin-left:auto;font-size:14px}
.namebar.missing{background:transparent;border:1px dashed var(--today);color:var(--today)}
.map-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;font-size:13px;color:var(--muted)}
.map-legend b{color:var(--ink)}
.voyage{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.port{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.port:last-child{border-bottom:0}
.port:hover .pt{color:var(--sea)}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);border:2px solid var(--sea);color:var(--sea);font-size:15px;background:var(--paper)}
.port.is-done .num{background:var(--done);border-color:var(--done);color:#fff}
.port.is-today .num{border-color:var(--today);color:var(--today)}
.pt{font-weight:700;line-height:1.3}
.pd{font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.chip.today{border-color:var(--today);color:var(--today)}
.chip.done{border-color:var(--done);color:var(--done)}
.btn{border:1px solid var(--sea);background:var(--sea);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
:root .btn{color:var(--paper)}
.btn.ghost{background:transparent;color:var(--sea)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--sea);font-weight:700;padding:6px 0}
.step-head{display:flex;flex-direction:column;gap:6px}
.step-head h2{font-size:clamp(26px,7vw,34px);line-height:1.15}
.q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.q + .q{border-top:1px dashed var(--line);padding-top:16px}
.q-label{font-weight:700;display:flex;gap:8px}
.q-label span{color:var(--sea);font-family:var(--display);font-weight:400}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sea-soft);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.thumb button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.upload{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--sea);color:var(--sea);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;width:fit-content}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.note{font-size:13px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px}
.overlay{position:fixed;inset:0;background:rgba(10,16,26,.85);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.overlay[hidden]{display:none}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;line-height:1;padding:4px 9px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap;vertical-align:middle}
.vchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vc)}
.pd{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;text-align:center;line-height:1.25;min-width:0}
.slot svg{width:100%;max-width:92px;height:auto;display:block}
.slot.got svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.slot.got:nth-child(odd) svg{transform:rotate(-5deg)}.slot.got:nth-child(even) svg{transform:rotate(4deg)}
.slot.got span{color:var(--ink)}
.slot span{max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.story{font-size:14px;color:var(--muted);font-style:italic;max-width:60ch;margin-top:-8px}
.yr{display:block;font-style:normal;font-size:11px;color:var(--sea);font-weight:700}
.head-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.head-sticker{width:96px;text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.head-sticker svg{width:96px;height:auto;display:block}
.head-sticker.got svg{transform:rotate(-6deg);filter:drop-shadow(0 3px 5px rgba(0,0,0,.22))}
.head-sticker.wait svg{opacity:.35;filter:grayscale(1)}
.overlay img{max-height:75vh;max-width:100%;border-radius:8px;background:#fff}
.overlay p{color:#fff;text-align:center;max-width:40ch}
.overlay .btn{background:#fff;color:#13223A;border-color:#fff}
@media (prefers-reduced-motion:no-preference){.port,.btn{transition:color .15s,background .15s}}
</style>

const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
let dbp=null;
function idb(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("odyssey-seoul",1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("answers");d.createObjectStore("media",{keyPath:"id"})};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)});
}
const memAnswers={};
async function getAnswers(){
  try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction("answers");const s=t.objectStore("answers");const out={};const c=s.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
  catch(e){return memAnswers}
}
async function putAnswer(k,v){memAnswers[k]=v;try{await tx("answers","readwrite",s=>s.put(v,k));return true}catch(e){return false}}
async function getMedia(step){
  try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction("media");const r=t.objectStore("media").getAll();r.onsuccess=()=>res(r.result.filter(m=>step==null||m.step===step).sort((a,b)=>a.t-b.t));r.onerror=()=>rej(r.error)})}
  catch(e){return []}
}
async function putMedia(m){try{await tx("media","readwrite",s=>s.put(m));return true}catch(e){return false}}
async function delMedia(id){try{await tx("media","readwrite",s=>s.delete(id))}catch(e){}}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(iso){const d=new Date(iso+"T12:00:00");return `${WD[d.getDay()]}, ${MONS[d.getMonth()]} ${d.getDate()}`}
const WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtLong(iso){const d=new Date(iso+"T12:00:00");return `${WDL[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`}
function stepWhenLong(s){return s.date?(s.end?`${fmtLong(s.date)} – ${fmtLong(s.end)}, 2026`:`${fmtLong(s.date)}, 2026`):s.when}
function stepWhen(s){return s.date?(s.end?`${fmt(s.date)} – ${fmt(s.end)}`:fmt(s.date)):s.when}
function todayISO(){const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function isToday(s){const t=todayISO();return s.date && t>=s.date && t<=(s.end||s.date)}

const urls=[];
function freeUrls(){while(urls.length)URL.revokeObjectURL(urls.pop())}

async function renderStep(n){
  const s=STEPS.find(x=>x.n===n); if(!s) return renderHome();
  const ans=await getAnswers(); const media=await getMedia(n);
  const app=$("#app");
  app.innerHTML=`
  <div class="topbar"><button class="back" id="back" type="button">← All steps</button>${isToday(s)?'<span class="chip today">Today</span>':""}</div>
  <div class="head-row">
  <header class="step-head">
    <span class="eyebrow">Step ${s.n} of 10 · ${stepWhenLong(s)}</span>
    <h2>${esc(s.title)}</h2>
    ${s.value?`<div>${valueChip(s)}</div>`:""}
  </header>
  <div class="head-sticker ${stepDone(s,ans,media)?"got":"wait"}" id="hs">${stickerSVG(s.n-1)}<span>${esc(TREASURES[s.n-1].name)}</span></div>
  </div>
  <p class="story">${esc(TREASURES[s.n-1].made)}</p>
  ${nameBar()}
  <section class="panel">
    ${s.qs.map((q,i)=>`<div class="q">
      <label class="q-label" for="a${i}">${s.qs.length>1?`<span>${i+1}.</span>`:""}${esc(q)}</label>
      <textarea id="a${i}" data-k="${s.n}-${i}" placeholder="Write here…">${esc(ans[`${s.n}-${i}`]||"")}</textarea>
      ${s.media&&i===1?`<div class="media-grid" id="mgrid"></div>
        <label class="upload">+ Add photo or video<input type="file" id="mfile" accept="image/*,video/*" multiple></label>`:""}
    </div>`).join("")}
    <p class="status" id="status" role="status"></p>
  </section>
  <section class="panel">
    <h3 style="font-size:18px">Share this step</h3>
    <p class="note">Save this page as one picture (JPG), then post it on our class Padlet.</p>
    <div class="btns"><button class="btn" id="jpgBtn" type="button">Save step ${s.n} as JPG</button><a class="btn ghost" href="https://padlet.com/realyejin/2026Exchange_EIS" target="_blank" rel="noopener">Open our Padlet ↗</a></div>
  </section>
  <nav class="pager">
    ${n>1?`<a class="btn ghost" href="#step-${n-1}">← Step ${n-1}</a>`:"<span></span>"}
    ${n<10?`<a class="btn ghost" href="#step-${n+1}">Step ${n+1} →</a>`:`<a class="btn ghost" href="#journey">My journey</a>`}
  </nav>`;
  $("#back").onclick=()=>{location.hash="home"};
  const status=$("#status"); let timers={};
  app.querySelectorAll("textarea").forEach(ta=>ta.addEventListener("input",()=>{
    clearTimeout(timers[ta.id]); status.textContent="Saving…";
    timers[ta.id]=setTimeout(async()=>{const ok=await putAnswer(ta.dataset.k,ta.value);status.textContent=ok?"Saved on this phone":"Could not save on this device. Copy your text somewhere safe.";const hs=$("#hs");if(hs&&ta.value.trim()){hs.classList.add("got");hs.classList.remove("wait")}},500);
  }));
  if(s.media){drawGrid(media);$("#mfile").addEventListener("change",async e=>{
    const files=[...e.target.files]; e.target.value="";
    for(const f of files){
      status.textContent=`Adding ${f.name}…`;
      try{
        const isVid=f.type.startsWith("video");
        const thumb=isVid?await videoFrame(f):await shrink(f,1400);
        const m={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),step:n,kind:isVid?"video":"photo",blob:f,thumb,t:Date.now()};
        const ok=await putMedia(m); if(!ok) status.textContent="Could not store this file on the device.";
      }catch(err){status.textContent=`Could not read ${f.name}.`}
    }
    drawGrid(await getMedia(n)); status.textContent="Saved on this phone";
  })}
  $("#jpgBtn").addEventListener("click",async()=>{
    if(!profile().name){status.textContent="Please write your name on the first page before saving.";return}
    const btn=$("#jpgBtn"); btn.disabled=true; status.textContent="Making your picture…";
    try{const c=await renderCard(s); const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
      await offer(blob,fileBase()+`-step${s.n}.jpg`,status,c.toDataURL("image/jpeg",.9));}
    catch(e){status.textContent="Could not make the picture."}
    btn.disabled=false;
  });
}
function drawGrid(media){
  freeUrls(); const g=$("#mgrid"); if(!g) return;
  g.innerHTML=media.map(m=>{const u=URL.createObjectURL(m.thumb);urls.push(u);
    return `<div class="thumb"><img src="${u}" alt="${m.kind}">${m.kind==="video"?'<span class="tag">▶ video</span>':""}<button type="button" data-del="${m.id}" aria-label="Remove">×</button></div>`}).join("");
  g.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await delMedia(b.dataset.del);drawGrid(await getMedia(+location.hash.split("-")[1]))});
}
function stepDone(s,ans,media){return s.qs.some((_,i)=>(ans[`${s.n}-${i}`]||"").trim())||media.some(m=>m.step===s.n)}
function nameBar(){const p=profile();
  return p.name?`<div class="namebar"><span>Name: <b>${esc(p.name)}</b></span>${p.buddy?`<span>Buddy: <b>${esc(p.buddy)}</b></span>`:""}<a href="#home">Edit</a></div>`
    :`<div class="namebar missing"><span>Write your name on the first page so it appears on your saved pages.</span><a href="#home">Add name</a></div>`}
function fileBase(){const p=profile();const n=(p.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[æÆ]/g,"ae").replace(/[øØ]/g,"o").replace(/[åÅ]/g,"a").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return "Odyssey-in-Seoul-"+(n||"student")}

/* ---------- media processing ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function shrink(file,max){
  const u=URL.createObjectURL(file);
  try{const img=await loadImg(u);const r=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));}
  finally{URL.revokeObjectURL(u)}
}
function videoFrame(file){
  return new Promise((res,rej)=>{
    const v=document.createElement("video");const u=URL.createObjectURL(file);
    v.muted=true;v.playsInline=true;v.preload="metadata";v.src=u;
    const fail=()=>{URL.revokeObjectURL(u);rej()};
    v.onerror=fail;
    v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
    v.onseeked=()=>{const r=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight));
      const c=document.createElement("canvas");c.width=Math.round(v.videoWidth*r)||640;c.height=Math.round(v.videoHeight*r)||360;
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};
    setTimeout(fail,15000);
  });
}

/* ---------- page image (shared by JPG and PDF) ---------- */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function wrap(ctx,text,maxW){
  const out=[];for(const para of String(text).split(/\n/)){
    if(!para.trim()){out.push("");continue}
    let line="";for(const word of para.split(/(\s+)/)){
      const test=line+word;
      if(ctx.measureText(test).width>maxW&&line.trim()){out.push(line.trimEnd());line=word.trimStart()}
      else if(ctx.measureText(word).width>maxW){for(const ch of word){if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch}else line+=ch}}
      else line=test;
    }
    out.push(line.trimEnd());
  }
  return out;
}
async function renderCard(s){
  try{await Promise.all([document.fonts.load('40px "Young Serif"'),document.fonts.load('24px "Atkinson Hyperlegible"'),document.fonts.load('bold 24px "Atkinson Hyperlegible"')])}catch(e){}
  const ans=await getAnswers(); const allMedia=await getMedia(null); const media=allMedia.filter(m=>m.step===s.n); const p=profile();
  const got=STEPS.map(st=>st.n===s.n||stepDone(st,ans,allMedia));
  const stickers=await Promise.all(STEPS.map((_,i)=>got[i]?stickerImg(i).catch(()=>null):null));
  const W=1080, PAD=72, CW=W-PAD*2, BIG=250, HEADW=CW-BIG-24;
  const SERIF='"Young Serif", Georgia, serif', SANS='"Atkinson Hyperlegible", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
  const C={ink:"#13223A",muted:"#5A6779",sea:"#1F6F8B",soft:"#DCEBF0",line:"#D5DDE3"};
  const m=document.createElement("canvas").getContext("2d");
  m.font=`52px ${SERIF}`; const titleL=wrap(m,s.title,HEADW);
  const T=TREASURES[s.n-1];
  const blocks=s.qs.map((q,i)=>{m.font=`bold 30px ${SANS}`;const ql=wrap(m,(s.qs.length>1?(i+1)+". ":"")+q,CW);
    m.font=`30px ${SANS}`;const a=(ans[`${s.n}-${i}`]||"").trim();const al=a?wrap(m,a,CW):["—"];return {ql,al,a}});
  const imgs=[];for(const md of media){const u=URL.createObjectURL(md.thumb);try{imgs.push({img:await loadImg(u),kind:md.kind})}catch(e){}URL.revokeObjectURL(u)}
  const cols=imgs.length===1?1:2, gap=20, cell=(CW-gap*(cols-1))/cols;
  const imgRows=Math.ceil(imgs.length/cols), imgH=imgs.length===1?Math.min(cell*imgs[0].img.height/imgs[0].img.width,900):cell;
  const VAL=VALUES[s.value];
  m.font=`italic 25px ${SANS}`; const storyL=wrap(m,T.made,HEADW);
  const headTextH=40+40+20+titleL.length*64+(VAL?56:0)+12+storyL.length*34;
  const headH=Math.max(headTextH, BIG+80);
  const SLOT=(CW-9*10)/10, bookH=36+SLOT+30+26;
  let H=PAD+headH+24+64+28+bookH+40;
  blocks.forEach(b=>{H+=b.ql.length*40+14+b.al.length*44+44});
  if(imgs.length) H+=imgRows*(imgH+gap)+20;
  H+=90;
  const c=document.createElement("canvas");c.width=W;c.height=Math.ceil(H);const x=c.getContext("2d");
  x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);
  x.fillStyle=C.sea;x.fillRect(0,0,W,14);
  // header text (left)
  let y=PAD+30; x.textBaseline="alphabetic";
  x.fillStyle=C.sea;x.font=`bold 24px ${SANS}`;x.fillText(`THE ODYSSEY IN SEOUL  ·  STEP ${s.n} OF 10`,PAD,y); y+=40;
  x.fillStyle=C.muted;x.font=`26px ${SANS}`;x.fillText(stepWhenLong(s),PAD,y); y+=20+50;
  if(VAL){x.font=`bold 22px ${SANS}`;const tw=x.measureText(VAL.label.toUpperCase()).width;const cw=tw+56, ch=40, cy=y-30;
    x.fillStyle=VAL.c+"22";x.beginPath();x.roundRect?x.roundRect(PAD,cy,cw,ch,20):x.rect(PAD,cy,cw,ch);x.fill();
    x.fillStyle=VAL.c;x.beginPath();x.arc(PAD+22,cy+ch/2,7,0,Math.PI*2);x.fill();
    x.fillText(VAL.label.toUpperCase(),PAD+38,cy+ch/2+8); y+=56;}
  x.fillStyle=C.ink;x.font=`52px ${SERIF}`;titleL.forEach(l=>{x.fillText(l,PAD,y);y+=64});
  y+=6;x.fillStyle=C.muted;x.font=`italic 25px ${SANS}`;storyL.forEach(l=>{x.fillText(l,PAD,y);y+=34});
  // big sticker (top right)
  const bx=W-PAD-BIG, by=PAD-24;
  if(stickers[s.n-1]){x.save();x.translate(bx+BIG/2,by+BIG/2);x.rotate(-6*Math.PI/180);
    x.shadowColor="rgba(0,0,0,.25)";x.shadowBlur=18;x.shadowOffsetY=6;
    x.drawImage(stickers[s.n-1],-BIG/2,-BIG/2,BIG,BIG);x.restore();}
  x.textAlign="center";x.fillStyle=C.sea;x.font=`bold 20px ${SANS}`;x.fillText(`STEP ${s.n} STICKER`,bx+BIG/2,by+BIG+28);
  x.fillStyle=C.ink;x.font=`bold 21px ${SANS}`;
  const tl=wrap(x,T.name,BIG+20).slice(0,2);tl.forEach((l,k)=>x.fillText(l,bx+BIG/2,by+BIG+54+k*24));
  
  x.textAlign="left";
  y=PAD+headH+24;
  // name bar
  x.fillStyle=C.soft;x.fillRect(PAD,y-8,CW,64);
  x.fillStyle=C.ink;x.font=`bold 30px ${SANS}`;
  x.fillText(`Name: ${p.name||"—"}`+(p.buddy?`     Buddy: ${p.buddy}`:""),PAD+20,y+34); y+=56+28;
  // sticker book strip
  const count=got.filter(Boolean).length;
  x.fillStyle=C.muted;x.font=`bold 20px ${SANS}`;x.fillText(`MY STICKER BOOK  ·  ${count} OF 10 STICKERS`,PAD,y+4); y+=24;
  for(let i=0;i<10;i++){const sx=PAD+i*(SLOT+10), sy=y;
    if(got[i]&&stickers[i]){x.save();x.translate(sx+SLOT/2,sy+SLOT/2);x.rotate((i%2?4:-5)*Math.PI/180);
      x.shadowColor="rgba(0,0,0,.2)";x.shadowBlur=6;x.shadowOffsetY=2;x.drawImage(stickers[i],-SLOT/2,-SLOT/2,SLOT,SLOT);x.restore();
      x.textAlign="center";x.fillStyle=i===s.n-1?C.sea:C.muted;x.font=`bold 15px ${SANS}`;x.fillText(TREASURES[i].yr,sx+SLOT/2,sy+SLOT+22);x.textAlign="left";
      if(i===s.n-1){x.strokeStyle=C.sea;x.lineWidth=3;x.beginPath();x.arc(sx+SLOT/2,sy+SLOT/2,SLOT/2+5,0,Math.PI*2);x.stroke()}}
    else{x.strokeStyle="#B7C2CC";x.lineWidth=2.5;x.setLineDash([8,6]);x.beginPath();x.arc(sx+SLOT/2,sy+SLOT/2,SLOT/2-3,0,Math.PI*2);x.stroke();x.setLineDash([]);
      x.fillStyle="#9AA6B2";x.font=`28px ${SERIF}`;x.textAlign="center";x.fillText(String(i+1),sx+SLOT/2,sy+SLOT/2+10);x.textAlign="left"}}
  y+=SLOT+30+26;
  x.fillStyle=C.line;x.fillRect(PAD,y,CW,2); y+=52;
  blocks.forEach((b,i)=>{
    x.fillStyle=C.sea;x.font=`bold 30px ${SANS}`;b.ql.forEach(l=>{x.fillText(l,PAD,y);y+=40});y+=14;
    x.fillStyle=b.a?C.ink:C.muted;x.font=`30px ${SANS}`;b.al.forEach(l=>{x.fillText(l,PAD,y);y+=44});
    if(s.media&&i===1&&imgs.length){y+=10;
      imgs.forEach((im,k)=>{const cx=PAD+(k%cols)*(cell+gap), cy=y+Math.floor(k/cols)*(imgH+gap);
        const iw=im.img.width, ih=im.img.height, sc=Math.max(cell/iw,imgH/ih), sw=cell/sc, sh=imgH/sc;
        x.save();x.beginPath();x.roundRect?x.roundRect(cx,cy,cell,imgH,16):x.rect(cx,cy,cell,imgH);x.clip();
        x.drawImage(im.img,(iw-sw)/2,(ih-sh)/2,sw,sh,cx,cy,cell,imgH);x.restore();
        if(im.kind==="video"){x.fillStyle="rgba(0,0,0,.6)";x.fillRect(cx+14,cy+imgH-54,150,40);x.fillStyle="#fff";x.font=`bold 22px ${SANS}`;x.fillText("▶ video",cx+28,cy+imgH-26)}});
      y+=imgRows*(imgH+gap)+10;}
    y+=30;
  });
  x.fillStyle=C.muted;x.font=`22px ${SANS}`;
  x.fillText("Eisbjerghus × Odyssey School · Seoul 2026",PAD,H-44);
  return c;
}

/* ---------- export ---------- */
let dlP=null;
function downloads(){if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);return dlP}
async function offer(blob,filename,status,previewURL){
  const dl=await downloads();
  if(dl){try{const r=await dl.save({filename,data:blob});status.textContent=r.status==="saved"?`Saved ${filename}. Add it to your class Padlet.`:"Sent.";return}
    catch(e){if(e&&e.code==="declined"){status.textContent="Not saved.";return}
      if(e&&e.code==="rate_limited"){status.textContent="A save window is already open. Try again in a moment.";return}}}
  if(previewURL){$("#ovImg").src=previewURL;$("#ovText").textContent="Press and hold the image to save it to your phone, then add it to Padlet.";$("#overlay").hidden=false;status.textContent=""}
  else status.textContent="Saving files is not available in this view. Use “Save step as JPG” on each step instead.";
}
async function exportPDF(){
  const st=$("#homeStatus"), btn=$("#pdfBtn");
  if(!profile().name){st.textContent="Please write your name above before saving.";$("#pName").focus();return}
  btn.disabled=true; st.textContent="Building your PDF…";
  try{
    const ans=await getAnswers(); const media=await getMedia(null);
    const written=STEPS.filter(s=>s.qs.some((_,i)=>(ans[`${s.n}-${i}`]||"").trim())||media.some(m=>m.step===s.n));
    if(!written.length){st.textContent="Write at least one step first.";btn.disabled=false;return}
    if(!window.jspdf){st.textContent="The PDF tool did not load. Check your connection and reload.";btn.disabled=false;return}
    const {jsPDF}=window.jspdf; let doc=null;
    for(const s of written){const c=await renderCard(s);const w=595, h=Math.round(595*c.height/c.width);
      const img=c.toDataURL("image/jpeg",.85);
      if(!doc){doc=new jsPDF({unit:"pt",format:[w,h],orientation:h>w?"p":"l"})}else doc.addPage([w,h],h>w?"p":"l");
      doc.addImage(img,"JPEG",0,0,w,h);}
    await offer(doc.output("blob"),fileBase()+"-journey.pdf",st,null);
  }catch(e){st.textContent="Could not build the PDF."}
  btn.disabled=false;
}
$("#ovClose").onclick=()=>{$("#overlay").hidden=true};

/* ---------- routing ---------- */
function route(){freeUrls();const h=location.hash.replace("#","");
  if(h==="journey"){location.hash="home";return}
  const m=h.match(/^step-(\d+)$/); if(m) renderStep(+m[1]); else renderHome(); window.scrollTo(0,0)}
window.addEventListener("hashchange",route); route();
</script>
